<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexa+ Multi-Modal Intelligence Hub | MCP Streamable HTTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(16, 22, 36, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --alexa-cyan: #00d2ff;
      --alexa-blue: #0070f3;
      --alexa-purple: #9d4edd;
      --alexa-pink: #ff2a85;
      --alexa-green: #00f59b;
      --alexa-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.16), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(157, 78, 221, 0.14), transparent 40%),
        radial-gradient(circle at 15% 75%, rgba(0, 245, 155, 0.09), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    .app-viewport {
      max-width: 980px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
    }

    .brand-logo span.plus {
      background: linear-gradient(135deg, var(--alexa-cyan), var(--alexa-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.55rem;
      font-weight: 900;
      margin-left: 2px;
    }

    .track-tag {
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(0, 210, 255, 0.12);
      color: var(--alexa-cyan);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(0, 210, 255, 0.25);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .latency-badge {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--alexa-green);
      background: rgba(0, 245, 155, 0.1);
      border: 1px solid rgba(0, 245, 155, 0.25);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      display: none;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: all 0.3s ease;
    }

    .dot.connected {
      background: var(--alexa-green);
      box-shadow: 0 0 10px var(--alexa-green);
    }

    .voice-toggle-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .voice-toggle-btn.active {
      color: var(--alexa-cyan);
      border-color: rgba(0, 210, 255, 0.4);
      background: rgba(0, 210, 255, 0.08);
    }

    /* Alexa+ Ambient Stage */
    .alexa-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 0.75rem 1rem;
      position: relative;
    }

    .orb-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .orb-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--alexa-cyan), var(--alexa-purple), transparent 70%);
      filter: blur(25px);
      opacity: 0.5;
      animation: orbBreathe 4s infinite ease-in-out;
    }

    .orb-sphere {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff 0%, #0070f3 35%, #9d4edd 70%, #ff2a85 100%);
      background-size: 200% 200%;
      box-shadow: 
        0 0 35px rgba(0, 210, 255, 0.6),
        inset 0 0 20px rgba(255, 255, 255, 0.6),
        inset -10px -10px 25px rgba(0, 0, 0, 0.5);
      animation: orbGradientShift 5s infinite linear;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .orb-wrapper:hover .orb-sphere {
      transform: scale(1.08);
    }

    .orb-wrapper.speaking .orb-sphere {
      animation: orbSpeaking 1.2s infinite ease-in-out, orbGradientShift 3s infinite linear;
    }

    .orb-wrapper.listening .orb-sphere {
      background: linear-gradient(135deg, #ff2a85 0%, #9d4edd 50%, #00d2ff 100%);
      box-shadow: 0 0 45px rgba(255, 42, 133, 0.8);
      transform: scale(1.12);
    }

    @keyframes orbBreathe {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.2); opacity: 0.75; }
    }

    @keyframes orbGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes orbSpeaking {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.14); }
      60% { transform: scale(0.96); }
    }

    /* Sound Wave Visualizer */
    .audio-waves {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 18px;
      margin-bottom: 0.5rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .audio-waves.active {
      opacity: 1;
    }

    .wave-bar {
      width: 3px;
      height: 6px;
      border-radius: 9999px;
      background: var(--alexa-cyan);
      animation: waveBounce 0.8s infinite ease-in-out;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; background: #38bdf8; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; background: var(--alexa-purple); }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; background: var(--alexa-pink); }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; background: var(--alexa-cyan); }

    @keyframes waveBounce {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }

    .stage-status {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
      min-height: 1.5rem;
    }

    /* Conversation Stream & Multi-Modal Cards */
    .conversation-stream {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
      min-height: 320px;
    }

    .bubble-row {
      display: flex;
      width: 100%;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bubble-row.user {
      justify-content: flex-end;
    }

    .bubble-row.alexa {
      justify-content: flex-start;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-bubble {
      background: linear-gradient(135deg, rgba(0, 112, 243, 0.4), rgba(157, 78, 221, 0.4));
      border: 1px solid rgba(0, 210, 255, 0.35);
      backdrop-filter: blur(16px);
      padding: 0.85rem 1.35rem;
      border-radius: 20px 20px 4px 20px;
      max-width: 75%;
      font-size: 0.95rem;
      color: #fff;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .alexa-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .spoken-text {
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.6;
      color: #ffffff;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .spoken-text::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--alexa-cyan);
      box-shadow: 0 0 12px var(--alexa-cyan);
      margin-top: 8px;
      flex-shrink: 0;
    }

    /* Multi-Modal Widgets */
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .weather-widget {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85));
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--alexa-cyan);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .comfort-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(0, 245, 155, 0.15);
      color: var(--alexa-green);
      border: 1px solid rgba(0, 245, 155, 0.3);
    }

    .temp-display {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .temp-val {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(180deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-meta-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      background: rgba(10, 15, 26, 0.7);
      border-radius: 12px;
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .meta-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .meta-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 2px;
    }

    /* Smart Home Actuations Card */
    .smart-home-card {
      background: linear-gradient(145deg, rgba(20, 28, 45, 0.75), rgba(15, 23, 42, 0.85));
      border: 1px solid rgba(157, 78, 221, 0.3);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .directives-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .directive-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 15, 26, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
    }

    .device-info {
      display: flex;
      flex-direction: column;
    }

    .device-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
    }

    .device-reason {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .action-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(0, 245, 155, 0.15);
      color: var(--alexa-green);
      border: 1px solid rgba(0, 245, 155, 0.3);
      white-space: nowrap;
    }

    /* Professional Card 2: Fire TV Display Calibration */
    .firetv-card {
      background: linear-gradient(145deg, rgba(14, 30, 50, 0.75), rgba(10, 20, 35, 0.85));
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .calibration-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .cal-box {
      background: rgba(8, 14, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 0.65rem 0.8rem;
    }

    .cal-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .cal-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--alexa-cyan);
      margin-top: 2px;
    }

    /* Professional Card 3: Energy Grid & Carbon Offset */
    .energy-card {
      background: linear-gradient(145deg, rgba(16, 36, 28, 0.75), rgba(10, 25, 20, 0.85));
      border: 1px solid rgba(0, 245, 155, 0.35);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .energy-highlight {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .wattage-val {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--alexa-green);
    }

    /* JSON-RPC Stream Inspector */
    .inspector-card {
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 0.75rem;
    }

    .inspector-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .inspector-toggle:hover {
      color: var(--alexa-cyan);
    }

    pre.json-payload {
      margin-top: 0.6rem;
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      max-height: 180px;
      overflow: auto;
      display: none;
    }

    pre.json-payload.visible {
      display: block;
    }

    /* Input & Interactive Dock */
    .control-dock {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .suggestion-chips {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .suggestion-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
      color: var(--alexa-cyan);
      transform: translateY(-1px);
    }

    .chip.primary {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 112, 243, 0.2));
      border-color: rgba(0, 210, 255, 0.4);
      color: #fff;
    }

    .input-bar {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .prompt-input {
      flex: 1;
      background: rgba(10, 15, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 0.85rem 1.4rem;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    .prompt-input:focus {
      border-color: var(--alexa-cyan);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
    }

    .mic-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .mic-btn:hover {
      background: rgba(0, 210, 255, 0.2);
      border-color: var(--alexa-cyan);
    }

    .mic-btn.recording {
      background: rgba(255, 42, 133, 0.3);
      border-color: var(--alexa-pink);
      color: var(--alexa-pink);
      animation: micPulse 1s infinite;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 42, 133, 0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 42, 133, 0.8); }
    }

    .send-btn {
      background: linear-gradient(135deg, var(--alexa-cyan), var(--alexa-blue));
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-logo">alexa<span class="plus">+</span></div>
        <div class="track-tag">MCP Streamable HTTP • Track 2</div>
      </div>
      <div class="header-actions">
        <div id="latencyBadge" class="latency-badge">⚡ 160ms</div>
        <div class="connection-status">
          <div id="statusDot" class="dot"></div>
          <span id="sessionStatus">Connecting /sse...</span>
        </div>
        <button id="voiceToggle" class="voice-toggle-btn active" onclick="toggleVoice()">
          <span id="voiceIcon">🔊</span> <span id="voiceLabel">Voice On</span>
        </button>
      </div>
    </header>

    <!-- Alexa+ Ambient Stage -->
    <div class="alexa-stage">
      <div id="alexaOrb" class="orb-wrapper" onclick="toggleMicRecording()">
        <div class="orb-glow"></div>
        <div class="orb-sphere"></div>
      </div>
      <div id="audioWaves" class="audio-waves">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div id="stageStatus" class="stage-status">Ready. Click "Check Climate" or tap the orb to speak.</div>
    </div>

    <!-- Live Conversation & Multi-Modal Cards -->
    <div id="conversationStream" class="conversation-stream">
      <!-- Default Welcome Card -->
      <div class="bubble-row alexa">
        <div class="alexa-card">
          <div class="spoken-text">
            Hello! I am connected to the <strong>Alexa+ Intelligence MCP Server</strong>. Try asking me to check climate, calibrate Fire TV display canvas, or activate energy grid savings.
          </div>
        </div>
      </div>
    </div>

    <!-- Control Dock -->
    <div class="control-dock">
      <div class="suggestion-chips">
        <button class="chip primary" onclick="handlePrompt('Alexa, check climate and optimize home')">
          🌤️ "Check Climate"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, calibrate Fire TV canvas')">
          📺 "Calibrate Fire TV Canvas"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, analyze energy grid savings')">
          ⚡ "Eco Energy & Grid Analytics"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, turn on Movie Night scene')">
          🎬 "Movie Night Mode"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, Good Night')">
          🌙 "Good Night Scene"
        </button>
      </div>

      <div class="input-bar">
        <input 
          id="customPrompt" 
          type="text" 
          class="prompt-input" 
          placeholder="Speak or ask Alexa+ anything (e.g. 'Check climate', 'Calibrate Fire TV')..."
          onkeydown="if(event.key === 'Enter') submitCustomPrompt()"
        />
        <button id="micBtn" class="mic-btn" onclick="toggleMicRecording()" title="Speak with microphone">
          🎙️
        </button>
        <button class="send-btn" onclick="submitCustomPrompt()" title="Send command">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let activeSessionId = null;
    let endpointUrl = null;
    let voiceEnabled = true;
    let isRecording = false;
    let recognition = null;
    let callStartTime = 0;

    // Default to Kolkata, India (Lat: 22.5726, Lon: 88.3639)
    let userLocation = {
      lat: 22.5726,
      lon: 88.3639,
      name: 'Kolkata, India'
    };

    // Auto-detect browser location if permitted
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation.lat = pos.coords.latitude;
          userLocation.lon = pos.coords.longitude;
          userLocation.name = 'Your Location';
        },
        () => console.log('Location preset: Kolkata, India')
      );
    }

    const orb = document.getElementById('alexaOrb');
    const audioWaves = document.getElementById('audioWaves');
    const stageStatus = document.getElementById('stageStatus');
    const statusDot = document.getElementById('statusDot');
    const sessionStatus = document.getElementById('sessionStatus');
    const latencyBadge = document.getElementById('latencyBadge');
    const conversationStream = document.getElementById('conversationStream');
    const micBtn = document.getElementById('micBtn');

    // 1. Establish SSE Stream with Server
    const eventSource = new EventSource('/sse');

    eventSource.addEventListener('endpoint', (e) => {
      endpointUrl = e.data;
      const params = new URLSearchParams(endpointUrl.split('?')[1]);
      activeSessionId = params.get('sessionId');
      
      statusDot.className = 'dot connected';
      sessionStatus.textContent = `SSE Active (${activeSessionId.substring(0, 8)})`;
      stageStatus.textContent = 'Alexa+ connected to MCP tools stream.';
    });

    eventSource.onmessage = (event) => {
      try {
        if (callStartTime > 0) {
          const latencyMs = Math.round(performance.now() - callStartTime);
          latencyBadge.textContent = `⚡ ${latencyMs}ms Latency`;
          latencyBadge.style.display = 'block';
        }
        const payload = JSON.parse(event.data);
        handleMcpResponse(payload);
      } catch (err) {
        console.error('Error parsing SSE event:', err);
      }
    };

    eventSource.onerror = () => {
      statusDot.className = 'dot';
      sessionStatus.textContent = 'Disconnected';
      stageStatus.textContent = 'Reconnecting to stream...';
    };

    // Voice Synthesis (Speech Out)
    function speakText(text) {
      if (!voiceEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.05;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        orb.classList.add('speaking');
        audioWaves.classList.add('active');
      };
      utterance.onend = () => {
        orb.classList.remove('speaking');
        audioWaves.classList.remove('active');
        stageStatus.textContent = 'Ready';
      };
      utterance.onerror = () => {
        orb.classList.remove('speaking');
        audioWaves.classList.remove('active');
      };
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById('voiceToggle');
      const icon = document.getElementById('voiceIcon');
      const label = document.getElementById('voiceLabel');

      if (voiceEnabled) {
        btn.classList.add('active');
        icon.textContent = '🔊';
        label.textContent = 'Voice On';
      } else {
        btn.classList.remove('active');
        icon.textContent = '🔇';
        label.textContent = 'Muted';
        window.speechSynthesis?.cancel();
      }
    }

    // Voice Input: Real Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        orb.classList.add('listening');
        stageStatus.textContent = '🎙️ Listening... Speak now.';
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('customPrompt').value = transcript;
        if (event.results[0].isFinal && transcript.trim().length > 0) {
          handlePrompt(transcript.trim());
        }
      };

      recognition.onerror = (event) => {
        console.warn('Speech recognition error:', event.error);
        stopRecording();
        if (event.error === 'not-allowed') {
          showNotification('Microphone permission was denied. Click the lock/shields icon in your browser URL bar to allow microphone access.');
        } else if (event.error === 'service-not-allowed') {
          showNotification('Brave Browser Privacy Note: Brave blocks Google Speech-to-Text by default. Go to brave://settings/privacy and turn on "Use Google services for speech recognition", or type in the bar below!');
        } else if (event.error === 'no-speech') {
          stageStatus.textContent = 'No voice detected. Tap mic or type below.';
        } else {
          showNotification('Speech input: ' + event.error + '. You can type your command in the prompt bar!');
        }
      };

      recognition.onend = () => {
        stopRecording();
      };
    }

    async function toggleMicRecording() {
      if (!recognition) {
        showNotification('Speech recognition is not supported in this browser engine. Please type your query in the prompt bar below!');
        return;
      }
      if (isRecording) {
        recognition.stop();
        stopRecording();
      } else {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          recognition.start();
        } catch (err) {
          console.warn('Mic access issue:', err);
          showNotification('Microphone access needed. Click the site settings in your URL bar to allow microphone.');
        }
      }
    }

    function stopRecording() {
      isRecording = false;
      micBtn.classList.remove('recording');
      orb.classList.remove('listening');
      stageStatus.textContent = 'Processing...';
    }

    function showNotification(msg) {
      stageStatus.textContent = msg;
      const row = document.createElement('div');
      row.className = 'bubble-row alexa';
      row.innerHTML = `
        <div class="alexa-card" style="border-color: rgba(251, 191, 36, 0.4); background: rgba(30, 25, 15, 0.8);">
          <div style="color: #fde047; font-size: 0.92rem; display: flex; align-items: center; gap: 0.5rem;">
            ⚠️ <strong>Voice / Speech Note:</strong>
          </div>
          <div style="font-size: 0.88rem; color: #fef08a; margin-top: 4px; line-height: 1.5;">
            ${escapeHtml(msg)}
          </div>
        </div>
      `;
      conversationStream.appendChild(row);
      row.scrollIntoView({ behavior: 'smooth' });
    }

    // Helper: Extract city name from speech
    function extractCityFromPrompt(text) {
      const match = text.match(/(?:in|for|at|around)\s+([a-zA-Z\s]+)/i);
      if (match && match[1]) {
        return match[1].replace(/and.*$/i, '').trim();
      }
      return null;
    }

    // Handle Prompts
    function handlePrompt(promptText) {
      appendUserBubble(promptText);

      stageStatus.textContent = 'Alexa+ is invoking MCP streamable tool...';
      orb.classList.add('speaking');
      audioWaves.classList.add('active');
      callStartTime = performance.now();

      const lower = promptText.toLowerCase();

      if (lower.includes('climate') || lower.includes('weather') || lower.includes('temp') || lower.includes('prep')) {
        const detectedCity = extractCityFromPrompt(promptText);
        if (detectedCity && detectedCity.toLowerCase() === 'kolkata') {
          invokeTool('get_weather_and_energy_advisory', {
            latitude: 22.5726,
            longitude: 88.3639,
            locationName: 'Kolkata, India',
            targetDeviceContext: 'fire_tv'
          });
        } else if (detectedCity) {
          invokeTool('get_weather_and_energy_advisory', {
            cityOrLocation: detectedCity,
            targetDeviceContext: 'fire_tv'
          });
        } else {
          invokeTool('get_weather_and_energy_advisory', {
            latitude: userLocation.lat,
            longitude: userLocation.lon,
            locationName: userLocation.name,
            targetDeviceContext: 'fire_tv'
          });
        }
      } else if (lower.includes('canvas') || lower.includes('fire tv') || lower.includes('calibrate') || lower.includes('display')) {
        invokeTool('optimize_firetv_ambient_canvas', {
          roomLux: 95,
          contentGenre: 'cinema_movie',
          hdrFormat: 'dolby_vision'
        });
      } else if (lower.includes('energy') || lower.includes('grid') || lower.includes('savings') || lower.includes('eco')) {
        invokeTool('calculate_energy_grid_savings', {
          thermostatSetbackC: 2.5,
          homeSquareMeters: 140
        });
      } else if (lower.includes('movie') || lower.includes('cinema')) {
        invokeTool('control_smart_home_scene', {
          sceneName: 'cozy_cinema',
          room: 'Living Room'
        });
      } else if (lower.includes('night') || lower.includes('sleep')) {
        invokeTool('control_smart_home_scene', {
          sceneName: 'good_night',
          room: 'Bedroom & Living Room'
        });
      } else {
        invokeTool('ask_alexa_assistant', { query: promptText });
      }
    }

    async function invokeTool(name, args) {
      if (!activeSessionId) {
        alert('SSE session is establishing. Please try again in a moment.');
        return;
      }

      const res = await fetch(`/messages?sessionId=${activeSessionId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jsonrpc: '2.0',
          id: Date.now(),
          method: 'tools/call',
          params: { name, arguments: args }
        })
      });

      if (!res.ok) {
        stageStatus.textContent = `Error: ${await res.text()}`;
        orb.classList.remove('speaking');
        audioWaves.classList.remove('active');
      }
    }

    // Process MCP Tool Response
    function handleMcpResponse(payload) {
      orb.classList.remove('speaking');
      audioWaves.classList.remove('active');
      stageStatus.textContent = 'Response received.';

      if (payload.result && payload.result.content && payload.result.content[0]) {
        try {
          const rawText = payload.result.content[0].text;
          const data = JSON.parse(rawText);

          if (data.telemetry) {
            renderWeatherAndDirectivesCard(data, payload);
          } else if (data.fireTvOptimization) {
            renderFireTvCalibrationCard(data, payload);
          } else if (data.energyOptimization) {
            renderEnergyAnalyticsCard(data, payload);
          } else if (data.activatedScene) {
            renderSceneCard(data, payload);
          } else if (data.assistantResponse) {
            renderAssistantAnswerCard(data, payload);
          } else {
            renderGenericCard(rawText, payload);
          }
        } catch (e) {
          renderGenericCard(payload.result.content[0].text, payload);
        }
      }
    }

    function appendUserBubble(text) {
      const row = document.createElement('div');
      row.className = 'bubble-row user';
      row.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
      conversationStream.appendChild(row);
      row.scrollIntoView({ behavior: 'smooth' });
    }

    function renderWeatherAndDirectivesCard(data, rawPayload) {
      const spoken = data.suggestedSpokenResponse || `Weather update for ${data.location}.`;
      speakText(spoken);

      const directivesHtml = (data.automationDirectives || []).map(d => `
        <div class="directive-item">
          <div class="device-info">
            <span class="device-name">${escapeHtml(d.targetDevice)}</span>
            <span class="device-reason">${escapeHtml(d.reason)}</span>
          </div>
          <span class="action-badge">${escapeHtml(d.action)}</span>
        </div>
      `).join('');

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(spoken)}</div>
            
            <div class="widget-grid">
              <div class="weather-widget">
                <div class="widget-header">
                  <span class="location-badge">📍 ${escapeHtml(data.location)}</span>
                  <span class="comfort-badge">Comfort: ${escapeHtml(data.telemetry.comfortScore || '88/100')}</span>
                </div>
                <div class="temp-display">
                  <span class="temp-val">${escapeHtml(data.telemetry.temperature)}</span>
                  <span style="font-size: 0.9rem; color: var(--text-muted);">Feels like ${escapeHtml(data.telemetry.apparentTemperature)}</span>
                </div>
                <div class="weather-meta-row">
                  <div class="meta-box">
                    <span class="meta-label">Humidity</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.humidity)}</span>
                  </div>
                  <div class="meta-box">
                    <span class="meta-label">Wind</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.windSpeed)}</span>
                  </div>
                  <div class="meta-box">
                    <span class="meta-label">UV Index</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.uvIndex || '3.2')}</span>
                  </div>
                  <div class="meta-box">
                    <span class="meta-label">Pressure</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.pressure || '1012 hPa')}</span>
                  </div>
                </div>
              </div>

              <div class="smart-home-card">
                <div class="card-title">⚡ Autonomous Directives (${(data.automationDirectives || []).length})</div>
                <div class="directives-list">
                  ${directivesHtml || '<div style="color: var(--text-muted); font-size: 0.85rem;">All indoor parameters optimal.</div>'}
                </div>
              </div>
            </div>

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderFireTvCalibrationCard(data, rawPayload) {
      const opt = data.fireTvOptimization;
      const spoken = data.spokenConfirmation || `Fire TV display calibrated.`;
      speakText(spoken);

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(spoken)}</div>

            <div class="firetv-card">
              <div class="widget-header">
                <span class="location-badge">📺 Fire TV Ambient Canvas Engine</span>
                <span class="comfort-badge" style="background: rgba(0, 210, 255, 0.15); color: var(--alexa-cyan); border-color: rgba(0, 210, 255, 0.3);">
                  ${escapeHtml(opt.hdrPipeline)}
                </span>
              </div>
              <div class="calibration-grid">
                <div class="cal-box">
                  <div class="cal-label">Luminance Output</div>
                  <div class="cal-val">${escapeHtml(opt.displayCalibration.panelTargetLuminance)}</div>
                </div>
                <div class="cal-box">
                  <div class="cal-label">Color Temp</div>
                  <div class="cal-val">${escapeHtml(opt.displayCalibration.colorCalibration)}</div>
                </div>
                <div class="cal-box">
                  <div class="cal-label">Motion Processing</div>
                  <div class="cal-val">${escapeHtml(opt.displayCalibration.motionSmoothing)}</div>
                </div>
                <div class="cal-box">
                  <div class="cal-label">Ambient Bias Backlight</div>
                  <div class="cal-val">${escapeHtml(opt.displayCalibration.ambientBiasLighting)}</div>
                </div>
              </div>
              <div style="font-size: 0.82rem; color: #94a3b8; background: rgba(0,0,0,0.3); padding: 0.5rem 0.8rem; border-radius: 8px;">
                🔊 <strong>Audio Profile:</strong> ${escapeHtml(opt.audioEngine)}
              </div>
            </div>

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderEnergyAnalyticsCard(data, rawPayload) {
      const opt = data.energyOptimization;
      const spoken = data.spokenConfirmation || `Energy saver active.`;
      speakText(spoken);

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(spoken)}</div>

            <div class="energy-card">
              <div class="widget-header">
                <span class="location-badge" style="color: var(--alexa-green);">⚡ Smart Grid Peak Optimization</span>
                <span class="comfort-badge">${escapeHtml(opt.thermostatDelta)}</span>
              </div>
              <div class="energy-highlight">
                <span class="wattage-val">${escapeHtml(opt.realTimeWattageReduction)}</span>
                <span style="font-size: 0.85rem; color: #a7f3d0;">Instantaneous Household Power Cut</span>
              </div>
              <div class="calibration-grid">
                <div class="cal-box">
                  <div class="cal-label">Estimated Monthly Savings</div>
                  <div class="cal-val" style="color: var(--alexa-green);">${escapeHtml(opt.estimatedMonthlySavings)}</div>
                </div>
                <div class="cal-box">
                  <div class="cal-label">Carbon Offset</div>
                  <div class="cal-val" style="color: #6ee7b7;">${escapeHtml(opt.dailyCarbonReduction)}</div>
                </div>
              </div>
              <div style="font-size: 0.8rem; color: #94a3b8;">
                🌱 <strong>Regulated:</strong> ${(opt.appliancesManaged || []).join(' • ')}
              </div>
            </div>

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderSceneCard(data, rawPayload) {
      const spoken = data.spokenConfirmation || `Activated ${data.activatedScene}.`;
      speakText(spoken);

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(spoken)}</div>

            <div style="background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(249, 115, 22, 0.15)); border: 1px solid rgba(234, 179, 8, 0.35); border-radius: 12px; padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; flex-direction: column;">
                <span style="font-weight: 700; color: #fef08a; font-size: 0.95rem;">🎬 Mode: ${escapeHtml(data.activatedScene.replace('_', ' ').toUpperCase())}</span>
                <span style="font-size: 0.78rem; color: #fed7aa; margin-top: 3px;">Room: ${escapeHtml(data.room)} • Lights: ${escapeHtml(data.appliedParameters.lights)}</span>
                <span style="font-size: 0.78rem; color: #fed7aa;">Thermostat: ${escapeHtml(data.appliedParameters.thermostat)} • TV: ${escapeHtml(data.appliedParameters.tvDisplay)}</span>
              </div>
              <span class="action-badge" style="background: rgba(234, 179, 8, 0.2); color: #facc15; border-color: rgba(234, 179, 8, 0.4);">LIVE</span>
            </div>

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderAssistantAnswerCard(data, rawPayload) {
      const resp = data.assistantResponse;
      const spoken = data.suggestedSpokenResponse || resp.answer;
      speakText(spoken);

      const suggestionsHtml = (resp.followUpSuggestions || []).map(s => `
        <button class="chip" onclick="handlePrompt('${escapeHtml(s)}')" style="font-size: 0.76rem; padding: 0.35rem 0.75rem;">
          💡 ${escapeHtml(s)}
        </button>
      `).join('');

      const formattedAnswer = escapeHtml(resp.answer).replace(/\n/g, '<br/>');

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="widget-header">
              <span class="location-badge" style="color: var(--alexa-purple);">🤖 ${escapeHtml(resp.title || 'Alexa+ Assistant')}</span>
              <span class="comfort-badge" style="background: rgba(157, 78, 221, 0.15); color: #c084fc; border-color: rgba(157, 78, 221, 0.3);">
                MCP Tool Response
              </span>
            </div>

            <div class="spoken-text" style="font-size: 1.05rem; line-height: 1.6;">
              ${formattedAnswer}
            </div>

            ${resp.followUpSuggestions && resp.followUpSuggestions.length > 0 ? `
              <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.25rem;">
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Suggested Actions:</span>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                  ${suggestionsHtml}
                </div>
              </div>
            ` : ''}

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderGenericCard(text, rawPayload) {
      speakText(text);
      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(text)}</div>
            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;
      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function toggleInspector(btn) {
      const pre = btn.nextElementSibling;
      const isVisible = pre.classList.toggle('visible');
      btn.textContent = isVisible ? '▼ Hide MCP JSON-RPC Stream Payload' : '▶ View MCP JSON-RPC Stream Payload';
    }

    function submitCustomPrompt() {
      const input = document.getElementById('customPrompt');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      handlePrompt(val);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
