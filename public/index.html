<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexa+ Multi-Modal Experience | MCP Streamable HTTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(16, 22, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --alexa-cyan: #00d2ff;
      --alexa-blue: #0070f3;
      --alexa-purple: #9d4edd;
      --alexa-pink: #ff2a85;
      --alexa-green: #00f59b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.15), transparent 45%),
        radial-gradient(circle at 80% 20%, rgba(157, 78, 221, 0.12), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(0, 245, 155, 0.08), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      overflow-x: hidden;
    }

    /* Main Container */
    .app-viewport {
      max-width: 960px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
    }

    .brand-logo span.plus {
      background: linear-gradient(135deg, var(--alexa-cyan), var(--alexa-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.6rem;
      font-weight: 900;
      margin-left: 2px;
    }

    .track-tag {
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(0, 210, 255, 0.12);
      color: var(--alexa-cyan);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(0, 210, 255, 0.25);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: all 0.3s ease;
    }

    .dot.connected {
      background: var(--alexa-green);
      box-shadow: 0 0 10px var(--alexa-green);
    }

    .voice-toggle-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .voice-toggle-btn.active {
      color: var(--alexa-cyan);
      border-color: rgba(0, 210, 255, 0.4);
      background: rgba(0, 210, 255, 0.08);
    }

    /* Alexa+ Stage & Glowing Orb */
    .alexa-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 1rem 1rem;
      position: relative;
    }

    .orb-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      cursor: pointer;
    }

    .orb-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--alexa-cyan), var(--alexa-purple), transparent 70%);
      filter: blur(25px);
      opacity: 0.5;
      animation: orbBreathe 4s infinite ease-in-out;
    }

    .orb-sphere {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff 0%, #0070f3 35%, #9d4edd 70%, #ff2a85 100%);
      background-size: 200% 200%;
      box-shadow: 
        0 0 30px rgba(0, 210, 255, 0.6),
        inset 0 0 20px rgba(255, 255, 255, 0.6),
        inset -10px -10px 25px rgba(0, 0, 0, 0.5);
      animation: orbGradientShift 5s infinite linear;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .orb-wrapper:hover .orb-sphere {
      transform: scale(1.08);
    }

    .orb-wrapper.speaking .orb-sphere {
      animation: orbSpeaking 1.2s infinite ease-in-out, orbGradientShift 3s infinite linear;
    }

    .orb-wrapper.speaking .orb-glow {
      opacity: 0.85;
      filter: blur(35px);
      animation: orbGlowPulse 1.2s infinite alternate ease-in-out;
    }

    @keyframes orbBreathe {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.2); opacity: 0.75; }
    }

    @keyframes orbGlowPulse {
      0% { transform: scale(1.1); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 1; }
    }

    @keyframes orbGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes orbSpeaking {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.14); }
      60% { transform: scale(0.96); }
    }

    /* Sound Wave Visualizer */
    .audio-waves {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
      margin-bottom: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .audio-waves.active {
      opacity: 1;
    }

    .wave-bar {
      width: 3px;
      height: 6px;
      border-radius: 9999px;
      background: var(--alexa-cyan);
      animation: waveBounce 0.8s infinite ease-in-out;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; background: #38bdf8; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; background: var(--alexa-purple); }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; background: var(--alexa-pink); }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; background: var(--alexa-cyan); }

    @keyframes waveBounce {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }

    .stage-status {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
      min-height: 1.5rem;
    }

    /* Conversation & Multi-Modal Display Area */
    .conversation-stream {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      min-height: 340px;
    }

    .bubble-row {
      display: flex;
      width: 100%;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bubble-row.user {
      justify-content: flex-end;
    }

    .bubble-row.alexa {
      justify-content: flex-start;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-bubble {
      background: linear-gradient(135deg, rgba(0, 112, 243, 0.35), rgba(157, 78, 221, 0.35));
      border: 1px solid rgba(0, 210, 255, 0.3);
      backdrop-filter: blur(16px);
      padding: 0.9rem 1.4rem;
      border-radius: 20px 20px 4px 20px;
      max-width: 75%;
      font-size: 1rem;
      color: #fff;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .alexa-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.6rem;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .spoken-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.6;
      color: #ffffff;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .spoken-text::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--alexa-cyan);
      box-shadow: 0 0 12px var(--alexa-cyan);
      margin-top: 8px;
      flex-shrink: 0;
    }

    /* Multi-Modal Widgets */
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .weather-widget {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    .weather-widget::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.15), transparent 70%);
      pointer-events: none;
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--alexa-cyan);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .temp-display {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .temp-val {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-meta-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      background: rgba(10, 15, 26, 0.6);
      border-radius: 12px;
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .meta-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .meta-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 2px;
    }

    /* Smart Home Actuations Card */
    .smart-home-card {
      background: linear-gradient(145deg, rgba(20, 28, 45, 0.7), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(157, 78, 221, 0.25);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .directives-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .directive-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 15, 26, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      transition: border-color 0.2s ease;
    }

    .directive-item:hover {
      border-color: rgba(0, 210, 255, 0.3);
    }

    .device-info {
      display: flex;
      flex-direction: column;
    }

    .device-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }

    .device-reason {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .action-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(0, 245, 155, 0.15);
      color: var(--alexa-green);
      border: 1px solid rgba(0, 245, 155, 0.3);
      white-space: nowrap;
    }

    /* Scene Mode Display */
    .scene-active-banner {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(249, 115, 22, 0.15));
      border: 1px solid rgba(234, 179, 8, 0.35);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scene-meta {
      display: flex;
      flex-direction: column;
    }

    .scene-title {
      font-weight: 700;
      color: #fef08a;
      font-size: 0.95rem;
    }

    .scene-params {
      font-size: 0.75rem;
      color: #fed7aa;
    }

    /* JSON-RPC Stream Inspector */
    .inspector-card {
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 0.75rem;
    }

    .inspector-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .inspector-toggle:hover {
      color: var(--alexa-cyan);
    }

    pre.json-payload {
      margin-top: 0.6rem;
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      max-height: 180px;
      overflow: auto;
      display: none;
    }

    pre.json-payload.visible {
      display: block;
    }

    /* Input & Interactive Dock */
    .control-dock {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .suggestion-chips {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .suggestion-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chip:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
      color: var(--alexa-cyan);
      transform: translateY(-1px);
    }

    .input-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .prompt-input {
      flex: 1;
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 0.85rem 1.4rem;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    .prompt-input:focus {
      border-color: var(--alexa-cyan);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--alexa-cyan), var(--alexa-blue));
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-logo">alexa<span class="plus">+</span></div>
        <div class="track-tag">MCP Streamable HTTP • Track 2</div>
      </div>
      <div class="header-actions">
        <div class="connection-status">
          <div id="statusDot" class="dot"></div>
          <span id="sessionStatus">Connecting /sse...</span>
        </div>
        <button id="voiceToggle" class="voice-toggle-btn active" onclick="toggleVoice()">
          <span id="voiceIcon">🔊</span> <span id="voiceLabel">Voice On</span>
        </button>
      </div>
    </header>

    <!-- Alexa+ Ambient Stage -->
    <div class="alexa-stage">
      <div id="alexaOrb" class="orb-wrapper" onclick="triggerDefaultVoicePrompt()">
        <div class="orb-glow"></div>
        <div class="orb-sphere"></div>
      </div>
      <div id="audioWaves" class="audio-waves">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div id="stageStatus" class="stage-status">Ready. Tap the orb or say a prompt below.</div>
    </div>

    <!-- Live Conversation & Multi-Modal Cards -->
    <div id="conversationStream" class="conversation-stream">
      <!-- Default initial card -->
      <div class="bubble-row alexa">
        <div class="alexa-card">
          <div class="spoken-text">
            Hello! I am connected to the <strong>Alexa+ Climate & Smart Home MCP Server</strong>. Try asking me to check the weather, activate cinema lighting on your Fire TV, or optimize your home.
          </div>
        </div>
      </div>
    </div>

    <!-- Control Dock -->
    <div class="control-dock">
      <div class="suggestion-chips">
        <button class="chip" onclick="handlePrompt('Alexa, check weather in Kolkata and prep my home')">
          🌤️ "Check weather in Kolkata"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, turn on Movie Night scene')">
          🎬 "Turn on Movie Night mode"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, activate Energy Saver mode')">
          ⚡ "Activate Energy Saver mode"
        </button>
        <button class="chip" onclick="handlePrompt('Alexa, Good Night')">
          🌙 "Good Night scene"
        </button>
      </div>

      <div class="input-bar">
        <input 
          id="customPrompt" 
          type="text" 
          class="prompt-input" 
          placeholder="Ask Alexa+ anything (e.g. 'Check weather in Seattle', 'Set cinema scene')..."
          onkeydown="if(event.key === 'Enter') submitCustomPrompt()"
        />
        <button class="send-btn" onclick="submitCustomPrompt()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let activeSessionId = null;
    let endpointUrl = null;
    let voiceEnabled = true;

    // Default to Kolkata, India (Lat: 22.5726, Lon: 88.3639)
    let userLocation = {
      lat: 22.5726,
      lon: 88.3639,
      name: 'Kolkata, India'
    };

    // Auto-detect browser location if permitted
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation.lat = pos.coords.latitude;
          userLocation.lon = pos.coords.longitude;
          userLocation.name = 'Your Location';
        },
        () => console.log('Using default location: Kolkata, India')
      );
    }

    const orb = document.getElementById('alexaOrb');
    const audioWaves = document.getElementById('audioWaves');
    const stageStatus = document.getElementById('stageStatus');
    const statusDot = document.getElementById('statusDot');
    const sessionStatus = document.getElementById('sessionStatus');
    const conversationStream = document.getElementById('conversationStream');

    // 1. Establish SSE Stream with Server
    const eventSource = new EventSource('/sse');

    eventSource.addEventListener('endpoint', (e) => {
      endpointUrl = e.data;
      const params = new URLSearchParams(endpointUrl.split('?')[1]);
      activeSessionId = params.get('sessionId');
      
      statusDot.className = 'dot connected';
      sessionStatus.textContent = `SSE Active (${activeSessionId.substring(0, 8)})`;
      stageStatus.textContent = 'Alexa+ connected to MCP tools stream.';
    });

    eventSource.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data);
        handleMcpResponse(payload);
      } catch (err) {
        console.error('Error parsing SSE event:', err);
      }
    };

    eventSource.onerror = () => {
      statusDot.className = 'dot';
      sessionStatus.textContent = 'Disconnected';
      stageStatus.textContent = 'Reconnecting to stream...';
    };

    // Voice Synthesis (Speech)
    function speakText(text) {
      if (!voiceEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.05;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        orb.classList.add('speaking');
        audioWaves.classList.add('active');
      };
      utterance.onend = () => {
        orb.classList.remove('speaking');
        audioWaves.classList.remove('active');
        stageStatus.textContent = 'Ready';
      };
      utterance.onerror = () => {
        orb.classList.remove('speaking');
        audioWaves.classList.remove('active');
      };
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById('voiceToggle');
      const icon = document.getElementById('voiceIcon');
      const label = document.getElementById('voiceLabel');

      if (voiceEnabled) {
        btn.classList.add('active');
        icon.textContent = '🔊';
        label.textContent = 'Voice On';
      } else {
        btn.classList.remove('active');
        icon.textContent = '🔇';
        label.textContent = 'Muted';
        window.speechSynthesis?.cancel();
      }
    }

    // Helper: Extract city from text like "in Kolkata" or "weather in Mumbai"
    function extractCityFromPrompt(text) {
      const match = text.match(/(?:in|for|at|around)\s+([a-zA-Z\s]+)/i);
      if (match && match[1]) {
        return match[1].replace(/and.*$/i, '').trim();
      }
      return null;
    }

    // Handle Prompts
    function handlePrompt(promptText) {
      appendUserBubble(promptText);

      stageStatus.textContent = 'Alexa+ is thinking and invoking MCP tools...';
      orb.classList.add('speaking');
      audioWaves.classList.add('active');

      const lower = promptText.toLowerCase();

      if (lower.includes('weather') || lower.includes('prep') || lower.includes('check') || lower.includes('temperature') || lower.includes('temp')) {
        const detectedCity = extractCityFromPrompt(promptText);
        if (detectedCity) {
          invokeTool('get_weather_and_energy_advisory', {
            cityOrLocation: detectedCity,
            targetDeviceContext: 'fire_tv'
          });
        } else {
          invokeTool('get_weather_and_energy_advisory', {
            latitude: userLocation.lat,
            longitude: userLocation.lon,
            locationName: userLocation.name,
            targetDeviceContext: 'fire_tv'
          });
        }
      } else if (lower.includes('movie') || lower.includes('cinema')) {
        invokeTool('control_smart_home_scene', {
          sceneName: 'cozy_cinema',
          room: 'Living Room'
        });
      } else if (lower.includes('energy') || lower.includes('eco')) {
        invokeTool('control_smart_home_scene', {
          sceneName: 'energy_saver',
          room: 'Whole House'
        });
      } else if (lower.includes('night') || lower.includes('sleep')) {
        invokeTool('control_smart_home_scene', {
          sceneName: 'good_night',
          room: 'Bedroom & Living Room'
        });
      } else {
        // Fallback default
        invokeTool('get_weather_and_energy_advisory', {
          latitude: userLocation.lat,
          longitude: userLocation.lon,
          locationName: userLocation.name
        });
      }
    }
      }
    }

    async function invokeTool(name, args) {
      if (!activeSessionId) {
        alert('SSE session is establishing. Please try again in a moment.');
        return;
      }

      const res = await fetch(`/messages?sessionId=${activeSessionId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jsonrpc: '2.0',
          id: Date.now(),
          method: 'tools/call',
          params: { name, arguments: args }
        })
      });

      if (!res.ok) {
        stageStatus.textContent = `Error: ${await res.text()}`;
        orb.classList.remove('speaking');
        audioWaves.classList.remove('active');
      }
    }

    // Process MCP Tool Response
    function handleMcpResponse(payload) {
      orb.classList.remove('speaking');
      audioWaves.classList.remove('active');
      stageStatus.textContent = 'Response received.';

      if (payload.result && payload.result.content && payload.result.content[0]) {
        try {
          const rawText = payload.result.content[0].text;
          const data = JSON.parse(rawText);

          if (data.telemetry) {
            renderWeatherAndDirectivesCard(data, payload);
          } else if (data.activatedScene) {
            renderSceneCard(data, payload);
          } else {
            renderGenericCard(rawText, payload);
          }
        } catch (e) {
          renderGenericCard(payload.result.content[0].text, payload);
        }
      }
    }

    function appendUserBubble(text) {
      const row = document.createElement('div');
      row.className = 'bubble-row user';
      row.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
      conversationStream.appendChild(row);
      row.scrollIntoView({ behavior: 'smooth' });
    }

    function renderWeatherAndDirectivesCard(data, rawPayload) {
      const spoken = data.suggestedSpokenResponse || `Weather update for ${data.location}.`;
      speakText(spoken);

      const directivesHtml = (data.automationDirectives || []).map(d => `
        <div class="directive-item">
          <div class="device-info">
            <span class="device-name">${escapeHtml(d.targetDevice)}</span>
            <span class="device-reason">${escapeHtml(d.reason)}</span>
          </div>
          <span class="action-badge">${escapeHtml(d.action)}</span>
        </div>
      `).join('');

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(spoken)}</div>
            
            <div class="widget-grid">
              <div class="weather-widget">
                <div class="widget-header">
                  <span class="location-badge">📍 ${escapeHtml(data.location)}</span>
                  <span style="font-size: 0.8rem; color: var(--alexa-cyan); font-weight: 600;">${escapeHtml(data.telemetry.condition)}</span>
                </div>
                <div class="temp-display">
                  <span class="temp-val">${escapeHtml(data.telemetry.temperature)}</span>
                  <span style="font-size: 0.9rem; color: var(--text-muted);">Feels like ${escapeHtml(data.telemetry.apparentTemperature)}</span>
                </div>
                <div class="weather-meta-row">
                  <div class="meta-box">
                    <span class="meta-label">Humidity</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.humidity)}</span>
                  </div>
                  <div class="meta-box">
                    <span class="meta-label">Wind</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.windSpeed)}</span>
                  </div>
                  <div class="meta-box">
                    <span class="meta-label">Rain</span>
                    <span class="meta-value">${escapeHtml(data.telemetry.precipitation)}</span>
                  </div>
                </div>
              </div>

              <div class="smart-home-card">
                <div class="card-title">⚡ Autonomous Directives (${(data.automationDirectives || []).length})</div>
                <div class="directives-list">
                  ${directivesHtml || '<div style="color: var(--text-muted); font-size: 0.85rem;">All indoor parameters optimal.</div>'}
                </div>
              </div>
            </div>

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderSceneCard(data, rawPayload) {
      const spoken = data.spokenConfirmation || `Activated ${data.activatedScene}.`;
      speakText(spoken);

      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(spoken)}</div>

            <div class="scene-active-banner">
              <div class="scene-meta">
                <span class="scene-title">🎬 Mode: ${escapeHtml(data.activatedScene.replace('_', ' ').toUpperCase())}</span>
                <span class="scene-params">Room: ${escapeHtml(data.room)} • Lights: ${escapeHtml(data.appliedParameters.lights)}</span>
                <span class="scene-params">Thermostat: ${escapeHtml(data.appliedParameters.thermostat)} • TV: ${escapeHtml(data.appliedParameters.tvDisplay)}</span>
              </div>
              <span class="action-badge" style="background: rgba(234, 179, 8, 0.2); color: #facc15; border-color: rgba(234, 179, 8, 0.4);">LIVE</span>
            </div>

            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;

      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function renderGenericCard(text, rawPayload) {
      speakText(text);
      const cardHtml = `
        <div class="bubble-row alexa">
          <div class="alexa-card">
            <div class="spoken-text">${escapeHtml(text)}</div>
            <div class="inspector-card">
              <button class="inspector-toggle" onclick="toggleInspector(this)">▶ View MCP JSON-RPC Stream Payload</button>
              <pre class="json-payload">${escapeHtml(JSON.stringify(rawPayload, null, 2))}</pre>
            </div>
          </div>
        </div>
      `;
      conversationStream.insertAdjacentHTML('beforeend', cardHtml);
      conversationStream.lastElementChild.scrollIntoView({ behavior: 'smooth' });
    }

    function toggleInspector(btn) {
      const pre = btn.nextElementSibling;
      const isVisible = pre.classList.toggle('visible');
      btn.textContent = isVisible ? '▼ Hide MCP JSON-RPC Stream Payload' : '▶ View MCP JSON-RPC Stream Payload';
    }

    function submitCustomPrompt() {
      const input = document.getElementById('customPrompt');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      handlePrompt(val);
    }

    function triggerDefaultVoicePrompt() {
      handlePrompt('Alexa, check weather and prep my home');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
